name: Finalize PR 599 translations

on:
  push:
    branches: [main]
    paths: [.github/workflows/pr-599-finalize.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-599-final-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'AyobamiH/element-admin'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PR_HEAD: 6943b50e1463e0009c36f4a9c4bf0c0d0a6d33a4
      UPSTREAM_HEAD: ed1208b377a71ee9b94decbf8ca056e5e7264153
      RESULT_BRANCH: maintenance/pr-599-verified-20260915
      CI: true
    steps:
      - name: Checkout the exact PR head without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6943b50e1463e0009c36f4a9c4bf0c0d0a6d33a4
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile only the reviewed fix onto current upstream
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/element-hq/element-admin.git "$UPSTREAM_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_HEAD"
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          python3 - <<'PY'
          import os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          head, upstream = os.environ['PR_HEAD'], os.environ['UPSTREAM_HEAD']
          path = 'src/routes/_console.rooms.$roomId.tsx'
          base = git('merge-base', head, upstream).strip()
          allowed = {path, 'translations/extracted/en.json', 'translations/compiled/en.json', 'translations/translated/en.json'}
          changed = set(git('diff', '--name-only', base, head).splitlines())
          assert changed == allowed, f'Unexpected original PR files: {changed}'
          original = git('show', f'{head}:{path}')
          start = original.index('    case "scheduled": {\n')
          end = original.index('    case "active": {', start)
          block = original[start:end]
          assert 'pages.rooms.deletion.scheduled.title' in block
          assert 'pages.rooms.deletion.scheduled.description' in block
          assert 'values={{ timestamp: task.timestamp_ms }}' in block
          baseline = git('show', f'{upstream}:{path}')
          needle = '    case "scheduled":\n    case "active": {'
          assert baseline.count(needle) == 1, 'Upstream scheduled state changed unexpectedly'
          expected = baseline.replace(needle, block + '    case "active": {', 1)
          subprocess.run(['git', 'checkout', '--detach', upstream], check=True)
          pathlib.Path(path).write_text(expected)
          assert pathlib.Path(path).read_text().replace(block, '    case "scheduled":\n', 1) == baseline
          print('PASS: original reviewed scheduled block retained; all other code is current upstream')
          print('PASS: translated catalogues and workflows are identical to upstream')
          PY

      - name: Install the upstream-pinned pnpm, Node.js and dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node

      - name: Regenerate English catalogues and run all source checks
        run: pnpm check

      - name: Verify exact scope, compiled messages and timezone rendering
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createIntl, createIntlCache } from 'react-intl';
          const upstream = process.env.UPSTREAM_HEAD;
          const ids = ['pages.rooms.deletion.scheduled.description', 'pages.rooms.deletion.scheduled.title'];
          const load = path => JSON.parse(readFileSync(path, 'utf8'));
          for (const path of ['translations/extracted/en.json', 'translations/compiled/en.json']) {
            const before = JSON.parse(execFileSync('git', ['show', `${upstream}:${path}`], {encoding: 'utf8'}));
            const after = load(path);
            assert.deepEqual(Object.keys(after).filter(id => !(id in before)).sort(), ids);
            for (const [id, value] of Object.entries(before)) assert.deepEqual(after[id], value, `Unrelated message changed: ${id}`);
            console.log(`PASS: ${path}: exactly two scheduled messages added, all existing messages preserved`);
          }
          const messages = load('translations/compiled/en.json');
          assert.deepEqual(messages[ids[0]].map(node => node.type), [0, 3, 0, 4, 0]);
          assert.deepEqual(messages[ids[1]], [{type: 0, value: 'Room deletion scheduled'}]);
          for (const locale of ['en-GB', 'en-US']) {
            for (const timeZone of ['UTC', 'Europe/London', 'America/Los_Angeles']) {
              const intl = createIntl({locale, timeZone, messages, onError(error) {throw error;}}, createIntlCache());
              for (const timestamp of [Date.parse('2027-01-01T00:30:00Z'), Date.parse('2026-07-01T12:30:00Z')]) {
                const scheduled = intl.formatMessage({id: ids[0]}, {timestamp});
                const active = intl.formatMessage({id: 'pages.rooms.deletion.in_progress.description'}, {timestamp});
                assert.equal(scheduled, active.replace('is in progress since', 'is scheduled for'));
                assert.equal(intl.formatMessage({id: ids[1]}), 'Room deletion scheduled');
                console.log(`PASS: ${locale} / ${timeZone} / ${timestamp}: ${scheduled}`);
              }
            }
          }
          const changed = execFileSync('git', ['diff', '--name-only', upstream], {encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(changed, ['src/routes/_console.rooms.$roomId.tsx', 'translations/compiled/en.json', 'translations/extracted/en.json']);
          NODE
          git diff --check
          git add -- 'src/routes/_console.rooms.$roomId.tsx' translations/compiled/en.json translations/extracted/en.json
          tree=$(git write-tree)
          candidate=$(printf '%s\n\n%s\n' 'Merge upstream and finalise scheduled deletion translations' 'Preserve the reviewed scheduled-state fix, regenerate extracted and compiled English messages with the current upstream tooling, and remove translated-catalogue ordering churn.' | git commit-tree "$tree" -p "$PR_HEAD" -p "$UPSTREAM_HEAD")
          git checkout --detach "$candidate"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$tree" >> "$GITHUB_ENV"
          echo "Candidate commit: $candidate"
          echo "Candidate tree: $tree"
          git diff --stat "$UPSTREAM_HEAD" HEAD

      - name: Verify regeneration is reproducible on the exact candidate
        run: |
          pnpm i18n:extract
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Check REUSE licence compliance on the candidate
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build the candidate frontend
        run: pnpm build

      - name: Run the complete Playwright suite without changing baselines
        run: pnpm test

      - name: Publish only the verified candidate to an isolated result branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/pr599-evidence"
          printf '{"candidate":"%s","tree":"%s","previousHead":"%s","upstream":"%s","checks":"pnpm check; reproducible extraction; message preservation; 12 locale/timezone cases; REUSE; build; complete Playwright suite"}\n' "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$PR_HEAD" "$UPSTREAM_HEAD" > "$RUNNER_TEMP/pr599-evidence/verification.json"
          git diff "$UPSTREAM_HEAD" HEAD > "$RUNNER_TEMP/pr599-evidence/final.diff"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$RESULT_BRANCH"
          unset auth GH_TOKEN
          echo "VERIFIED_CANDIDATE=$CANDIDATE_SHA"
          echo "The PR branch has not been changed by this workflow."

      - name: Save verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-599-final-verification
          path: |
            ${{ runner.temp }}/pr599-evidence/
            playwright-report/
          retention-days: 14
